name: Renew fps.ms Server Daily

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC (12:00 Israel time)
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xvfb and Playwright
        run: |
          sudo apt-get install -y xvfb
          pip install playwright
          playwright install chromium --with-deps

      - name: Renew fps.ms server
        env:
          FPS_EMAIL: ${{ secrets.FPS_EMAIL }}
          FPS_PASSWORD: ${{ secrets.FPS_PASSWORD }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python3 << 'PYEOF'
          import asyncio, os, sys
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=False,
                      ignore_default_args=['--enable-automation'],
                      args=[
                          '--disable-blink-features=AutomationControlled',
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--disable-infobars',
                          '--window-size=1280,900'
                      ]
                  )
                  context = await browser.new_context(
                      viewport={'width': 1280, 'height': 900},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  )
                  page = await context.new_page()

                  # Mask automation signals
                  await page.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      window.chrome = {runtime: {}};
                      Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});
                      Object.defineProperty(navigator, 'languages', {get: () => ['en-US','en']});
                  """)

                  # Login
                  print("Navigating to login page...")
                  await page.goto('https://panel.fps.ms/auth/login', wait_until='domcontentloaded')
                  await page.wait_for_timeout(4000)
                  print(f"Page title: {await page.title()}")

                  # Fill login form
                  await page.fill('input[type="email"]', os.environ['FPS_EMAIL'])
                  await page.fill('input[type="password"]', os.environ['FPS_PASSWORD'])
                  print("Filled credentials, submitting...")
                  await page.click('button[type="submit"]')
                  await page.wait_for_url('**/server/**', timeout=30000)
                  print("Logged in!")

                  # Navigate to server page
                  await page.goto('https://panel.fps.ms/server/0cc613ed-1676-48cf-8840-941d9b6b39a8')
                  await page.wait_for_load_state('networkidle')
                  await page.wait_for_timeout(3000)
                  await page.wait_for_function('window.turnstile !== undefined', timeout=20000)

                  # Render Turnstile and get token
                  print("Solving Turnstile...")
                  token = await page.evaluate("""() => new Promise((resolve, reject) => {
                      const div = document.createElement('div');
                      div.id = 'ts-renew';
                      document.body.appendChild(div);
                      window.turnstile.render('#ts-renew', {
                          sitekey: '0x4AAAAAAB7AoTxwnnLxiHiL',
                          callback: resolve,
                          'error-callback': reject
                      });
                  })""")
                  print(f"Token: {token[:30]}...")

                  # Call renew API
                  result = await page.evaluate(
                      """async (tok) => {
                          const r = await fetch(
                              '/api/client/servers/0cc613ed-1676-48cf-8840-941d9b6b39a8/billing/renew',
                              {method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'},
                               body: JSON.stringify({'cf-turnstile-response': tok})}
                          );
                          return {status: r.status, body: await r.text()};
                      }""", token)

                  status, body = result['status'], result['body']
                  print(f"Renew: {status} - {body[:300]}")

                  if status in (200, 201, 204):
                      print("Renewed!")
                  elif status == 429:
                      print("Rate limited - OK")
                  elif status == 400 and ('eligible' in body.lower() or 'hours' in body.lower()):
                      print("Not yet eligible - OK")
                  else:
                      print(f"Unexpected: {status}")
                      sys.exit(1)

                  await browser.close()

          asyncio.run(main())
          PYEOF
